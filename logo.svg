<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" ry="96" fill="#000000"/>
  <rect x="16" y="16" width="480" height="480" rx="88" ry="88" fill="none" stroke="#00FFEA" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Glow filter -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M 290 120 L 160 260 L 240 260 L 210 390 L 350 230 L 260 230 Z" fill="none" stroke="#00FFEA" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
</svg>
