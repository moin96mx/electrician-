<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ElectroHubBD Admin</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    :root{--bg:#071018;--panel:#0f172a;--line:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--cyan:#00ffcc;--red:#ef4444;--green:#34d399}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    .container{max-width:1300px;margin:0 auto;padding:32px 20px}.login-box{max-width:420px;margin:80px auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
    .field{margin-bottom:16px}.field label{display:block;margin-bottom:8px;color:var(--muted)}.field input,.search{width:100%;padding:12px;background:#0b1220;border:1px solid var(--line);border-radius:8px;color:var(--text)}
    .primary{width:100%;background:var(--cyan);color:#041019;border:0;border-radius:8px;padding:12px;font-weight:bold;cursor:pointer}.hidden{display:none!important}
    .tabs,.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab,.subtab,.btn,.pag-btn,.logout{padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:#0b1220;color:var(--text);cursor:pointer}
    .tab.active,.subtab.active,.pag-btn.active{background:var(--cyan);color:#041019}.panel,.stat{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:18px;overflow:auto}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:24px;color:var(--cyan);font-weight:bold}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}.search{margin:12px 0}
    .table-scroll{width:100%;overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:8px}
    .table-scroll:focus{outline:2px solid var(--cyan);outline-offset:2px}
    .table-scroll::-webkit-scrollbar{height:12px}.table-scroll::-webkit-scrollbar-track{background:#0b1220;border-radius:8px}.table-scroll::-webkit-scrollbar-thumb{background:#475569;border:2px solid #0b1220;border-radius:8px}
    table{width:100%;min-width:1100px;border-collapse:collapse}th,td{min-width:100px;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:top}th{color:var(--muted);white-space:nowrap}
    .map-link{display:inline-block;padding:6px 9px;border:1px solid var(--cyan);border-radius:7px;color:var(--cyan);text-decoration:none;white-space:nowrap}
    td{max-width:280px;overflow-wrap:anywhere;white-space:pre-wrap}.notice{color:var(--muted);font-size:13px}.btn-red{color:#fca5a5}.btn-green{color:#6ee7b7}
    .pagination{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}.pag-info{color:var(--muted);font-size:12px}
    @media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.container{padding:18px 12px}.panel{padding:12px}}
  </style>
</head>
<body>
  <main class="container">
    <section id="loginView" class="login-box">
      <h1>ElectroHubBD Admin</h1>
      <p class="notice">শুধু অনুমোদিত admin account দিয়ে প্রবেশ করুন।</p>
      <form id="loginForm">
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button class="primary" id="loginBtn" type="submit">Login</button>
      </form>
      <p id="loginError" role="alert" class="notice"></p>
    </section>

    <section id="adminView" class="hidden">
      <div class="topbar"><h1>ElectroHubBD Dashboard</h1><div><span id="userEmail" class="notice"></span> <button class="logout" id="logoutBtn" type="button">Logout</button></div></div>
      <div class="stats">
        <div class="stat"><div class="label">Bookings</div><div class="value" id="statBookings">0</div></div>
        <div class="stat"><div class="label">Contacts</div><div class="value" id="statContacts">0</div></div>
        <div class="stat"><div class="label">Complaints</div><div class="value" id="statOvijog">0</div></div>
        <div class="stat"><div class="label">Shop orders</div><div class="value" id="statShop">0</div></div>
      </div>
      <nav class="tabs" aria-label="Admin data">
        <button class="tab active" type="button" data-tab="bookings">Bookings</button>
        <button class="tab" type="button" data-tab="contacts">Contacts</button>
        <button class="tab" type="button" data-tab="ovijog">Complaints</button>
        <button class="tab" type="button" data-tab="shop">Shop orders</button>
      </nav>
      <section id="tab-bookings" class="panel">
        <h2>Bookings <span id="bookingsInfo" class="notice"></span></h2>
        <input id="searchBookings" class="search" type="search" placeholder="Search this page">
        <div id="bookingsTable" class="notice">Loading...</div><div id="bookingsPagination" class="pagination"></div>
      </section>
      <section id="tab-contacts" class="panel hidden">
        <h2>Contacts <span id="contactsInfo" class="notice"></span></h2>
        <input id="searchContacts" class="search" type="search" placeholder="Search this page">
        <div id="contactsTable" class="notice">Loading...</div><div id="contactsPagination" class="pagination"></div>
      </section>
      <section id="tab-ovijog" class="panel hidden">
        <h2>Complaints <span id="ovijogInfo" class="notice"></span></h2>
        <input id="searchOvijog" class="search" type="search" placeholder="Search this page">
        <div id="ovijogTable" class="notice">Loading...</div><div id="ovijogPagination" class="pagination"></div>
      </section>
      <section id="tab-shop" class="panel hidden">
        <h2>Shop orders <span id="shopInfo" class="notice"></span></h2>
        <div class="subtabs" aria-label="Filter orders">
          <button class="subtab active" type="button" data-shop="all">All</button>
          <button class="subtab" type="button" data-shop="pending">Pending</button>
          <button class="subtab" type="button" data-shop="archived">Archived</button>
        </div>
        <input id="searchShop" class="search" type="search" placeholder="Search this page">
        <div id="shopTable" class="notice">Loading...</div><div id="shopPagination" class="pagination"></div>
      </section>
    </section>
  </main>
  <script src="/supabase-config.js?v=cac31b0" defer></script>
  <script src="/admin/admin.js?v=20261102-location" defer></script>
</body>
</html>
