<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElectroTechBD Admin</title>
    <style>
      :root {
        --bg: #071018;
        --panel: #0f172a;
        --line: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --cyan: #00ffcc;
        --purple: #9d4edd;
        --green: #34d399;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 28px;
      }

      .logout {
        padding: 10px 16px;
        background: #1f2937;
        color: var(--text);
        border: 1px solid var(--line);
        cursor: pointer;
        border-radius: 8px;
      }

      .login-box, .stats, .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 0 20px rgba(0,255,204,0.08);
      }

      .login-box {
        max-width: 420px;
        margin: 80px auto 0;
        padding: 28px;
      }

      .login-box h2 {
        margin-top: 0;
      }

      .field {
        margin-bottom: 16px;
      }

      .field label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
      }

      .field input {
        width: 100%;
        padding: 12px 14px;
        background: #0b1220;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
      }

      .primary {
        width: 100%;
        background: linear-gradient(135deg, var(--cyan), var(--purple));
        color: #041019;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-weight: bold;
        cursor: pointer;
      }

      .hidden {
        display: none !important;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 18px;
        padding: 20px;
        margin-bottom: 24px;
      }

      .stat {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
      }

      .stat .label {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 8px;
      }

      .stat .value {
        font-size: 28px;
        font-weight: bold;
        color: var(--cyan);
      }

      .panel {
        padding: 20px;
      }

      .panel h3 {
        margin-top: 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
      }

      .notice {
        color: var(--muted);
      }

      @media (max-width: 700px) {
        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="loginView">
        <div class="login-box">
          <h2>ElectroTechBD Admin</h2>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" value="admin" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" value="123456" />
          </div>
          <button class="primary" id="loginBtn">Login</button>
        </div>
      </div>

      <div id="adminView" class="hidden">
        <div class="topbar">
          <h1>Lead Dashboard</h1>
          <button class="logout" id="logoutBtn">Logout</button>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="label">Total Bookings</div>
            <div class="value" id="totalBookings">0</div>
          </div>
          <div class="stat">
            <div class="label">Total Contact Leads</div>
            <div class="value" id="totalContacts">0</div>
          </div>
          <div class="stat">
            <div class="label">Pending</div>
            <div class="value" id="pendingCount">0</div>
          </div>
        </div>

        <div class="panel">
          <h3>Booking Requests</h3>
          <div id="bookingsTable"></div>
        </div>

        <div class="panel" style="margin-top: 24px;">
          <h3>Contact Leads</h3>
          <div id="contactsTable"></div>
        </div>
      </div>
    </div>

    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

      const SUPABASE_URL = 'https://gskxbqbdefkgtycktndc.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_RpOcHAaXMSIyAvKnhan7Bg_am9YiCHm';
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const loginView = document.getElementById('loginView');
      const adminView = document.getElementById('adminView');
      const loginBtn = document.getElementById('loginBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      function setToken(token) {
        localStorage.setItem('electrotech_admin_token', token);
      }

      function getToken() {
        return localStorage.getItem('electrotech_admin_token');
      }

      function clearToken() {
        localStorage.removeItem('electrotech_admin_token');
      }

      async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
          alert('দয়া করে ইউজারনেম এবং পাসওয়ার্ড দিন।');
          return;
        }

        try {
          const { data, error } = await supabase
            .from('admins')
            .select('*')
            .eq('username', username)
            .eq('password', password)
            .single();

          if (error || !data) {
            alert('ভুল ইউজারনেম বা পাসওয়ার্ড!');
            return;
          }

          setToken('supabase_authenticated_admin');
          alert('লগইন সফল হয়েছে!');
          renderDashboard();
        } catch (err) {
          console.error('Login error:', err);
          alert('লগইন করার সময় একটি সমস্যা হয়েছে।');
        }
      }

      async function loadDashboard() {
        if (!getToken()) {
          showLogin();
          return;
        }

        const { data: bookings } = await supabase.from('bookings').select('*');
        const { data: contacts } = await supabase.from('contacts').select('*');

        const bookingList = bookings || [];
        const contactList = contacts || [];

        document.getElementById('totalBookings').textContent = bookingList.length;
        document.getElementById('totalContacts').textContent = contactList.length;
        document.getElementById('pendingCount').textContent = bookingList.filter((item) => (item.status || 'new') === 'new').length;

        document.getElementById('bookingsTable').innerHTML = bookingList.length ? `
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Service</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${bookingList.map((item) => `
                <tr>
                  <td>${item.id}</td>
                  <td>${item.name}</td>
                  <td>${item.phone}</td>
                  <td>${item.service}</td>
                  <td>${item.status || 'new'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        ` : '<p class="notice">কোনো বুকিং রিকোয়েস্ট নেই।</p>';

        document.getElementById('contactsTable').innerHTML = contactList.length ? `
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Contact</th>
                <th>Message</th>
              </tr>
            </thead>
            <tbody>
              ${contactList.map((item) => `
                <tr>
                  <td>${item.id}</td>
                  <td>${item.name}</td>
                  <td>${item.contact}</td>
                  <td>${item.message || '—'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        ` : '<p class="notice">কোনো কন্টাক্ট লিড নেই।</p>';
      }

      function showLogin() {
        loginView.classList.remove('hidden');
        adminView.classList.add('hidden');
      }

      function showAdmin() {
        loginView.classList.add('hidden');
        adminView.classList.remove('hidden');
      }

      function renderDashboard() {
        if (getToken()) {
          showAdmin();
          loadDashboard();
          return;
        }
        showLogin();
      }

      loginBtn.addEventListener('click', login);
      logoutBtn.addEventListener('click', () => {
        clearToken();
        renderDashboard();
      });

      renderDashboard();
    </script>
  </body>
</html>
