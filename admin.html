<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElectroTechBD Admin</title>
    <style>
      :root {
        --bg: #071018;
        --panel: #0f172a;
        --line: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --cyan: #00ffcc;
        --purple: #9d4edd;
        --green: #34d399;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 28px;
      }

      .logout {
        padding: 10px 16px;
        background: #1f2937;
        color: var(--text);
        border: 1px solid var(--line);
        cursor: pointer;
        border-radius: 8px;
      }

      .login-box, .stats, .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 0 20px rgba(0,255,204,0.08);
      }

      .login-box {
        max-width: 420px;
        margin: 80px auto 0;
        padding: 28px;
      }

      .login-box h2 {
        margin-top: 0;
      }

      .field {
        margin-bottom: 16px;
      }

      .field label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
      }

      .field input {
        width: 100%;
        padding: 12px 14px;
        background: #0b1220;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
      }

      .primary {
        width: 100%;
        background: linear-gradient(135deg, var(--cyan), var(--purple));
        color: #041019;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-weight: bold;
        cursor: pointer;
      }

      .hidden {
        display: none !important;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 18px;
        padding: 20px;
        margin-bottom: 24px;
      }

      .stat {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
      }

      .stat .label {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 8px;
      }

      .stat .value {
        font-size: 28px;
        font-weight: bold;
        color: var(--cyan);
      }

      .panel {
        padding: 20px;
      }

      .panel h3 {
        margin-top: 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
      }

      .badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
        background: rgba(52, 211, 153, 0.1);
        color: var(--green);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
        align-items: center;
      }

      .search-input, .filter-select, .export-btn, .danger-btn, .status-select, .status-btn {
        background: #0b1220;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
      }

      .search-input {
        flex: 1;
        min-width: 200px;
      }

      .filter-select {
        min-width: 180px;
      }

      .export-btn, .status-btn {
        cursor: pointer;
        background: rgba(0,255,204,0.08);
        color: var(--cyan);
      }

      .danger-btn {
        cursor: pointer;
        background: rgba(239, 68, 68, 0.08);
        color: #fca5a5;
      }

      .status-select {
        background: #0b1220;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
      }

      .status-btn {
        margin-left: 8px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        background: #111827;
        color: var(--text);
        border-radius: 8px;
        cursor: pointer;
      }

      .notice {
        color: var(--muted);
      }

      @media (max-width: 700px) {
        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="loginView">
        <div class="login-box">
          <h2>ElectroTechBD Admin</h2>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" value="admin" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" value="electrotech123" />
          </div>
          <button class="primary" id="loginBtn">Login</button>
        </div>
      </div>

      <div id="adminView" class="hidden">
        <div class="topbar">
          <h1>Lead Dashboard</h1>
          <button class="logout" id="logoutBtn">Logout</button>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="label">Total Bookings</div>
            <div class="value" id="totalBookings">0</div>
          </div>
          <div class="stat">
            <div class="label">Total Contact Leads</div>
            <div class="value" id="totalContacts">0</div>
          </div>
          <div class="stat">
            <div class="label">Pending</div>
            <div class="value" id="pendingCount">0</div>
          </div>
        </div>

        <div class="panel">
          <h3>Booking Requests</h3>
          <div class="toolbar">
            <input id="bookingSearch" class="search-input" type="text" placeholder="Search name, phone or service" />
            <select id="bookingFilter" class="filter-select">
              <option value="all">All statuses</option>
              <option value="new">New</option>
              <option value="contacted">Contacted</option>
              <option value="in-progress">In Progress</option>
              <option value="done">Done</option>
              <option value="cancelled">Cancelled</option>
            </select>
            <button id="exportBookings" class="export-btn" type="button">Export CSV</button>
          </div>
          <div id="bookingsTable"></div>
        </div>

        <div class="panel" style="margin-top: 24px;">
          <h3>Contact Leads</h3>
          <div class="toolbar">
            <input id="contactSearch" class="search-input" type="text" placeholder="Search name or contact" />
            <button id="exportContacts" class="export-btn" type="button">Export CSV</button>
          </div>
          <div id="contactsTable"></div>
        </div>
      </div>
    </div>

    <script>
      const loginView = document.getElementById('loginView');
      const adminView = document.getElementById('adminView');
      const loginBtn = document.getElementById('loginBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      function setToken(token) {
        localStorage.setItem('electrotech_admin_token', token);
      }

      function getToken() {
        return localStorage.getItem('electrotech_admin_token');
      }

      function clearToken() {
        localStorage.removeItem('electrotech_admin_token');
      }

      async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const result = await res.json();

        if (!res.ok || !result.success) {
          alert(result.message || 'Login failed');
          return;
        }

        setToken(result.token);
        renderDashboard();
      }

      function escapeCsv(value) {
        return `"${String(value ?? '').replace(/"/g, '""')}"`;
      }

      function getFilteredBookings(bookings, searchText, statusFilter) {
        const term = searchText.trim().toLowerCase();
        return bookings.filter((item) => {
          const matchesStatus = statusFilter === 'all' || (item.status || 'new') === statusFilter;
          if (!matchesStatus) return false;
          if (!term) return true;

          const haystack = [item.id, item.name, item.phone, item.service].join(' ').toLowerCase();
          return haystack.includes(term);
        });
      }

      function getFilteredContacts(contacts, searchText) {
        const term = searchText.trim().toLowerCase();
        return contacts.filter((item) => {
          if (!term) return true;
          const haystack = [item.id, item.name, item.contact, item.message].join(' ').toLowerCase();
          return haystack.includes(term);
        });
      }

      async function deleteBooking(bookingId) {
        const token = getToken();
        if (!token) return;

        const confirmed = window.confirm('Delete this booking lead?');
        if (!confirmed) return;

        const res = await fetch(`/api/bookings/${encodeURIComponent(bookingId)}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${token}` }
        });

        const result = await res.json();
        if (!res.ok || !result.success) {
          alert(result.message || 'Failed to delete booking');
          return;
        }

        loadDashboard();
      }

      async function deleteContact(contactId) {
        const token = getToken();
        if (!token) return;

        const confirmed = window.confirm('Delete this contact lead?');
        if (!confirmed) return;

        const res = await fetch(`/api/contacts/${encodeURIComponent(contactId)}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${token}` }
        });

        const result = await res.json();
        if (!res.ok || !result.success) {
          alert(result.message || 'Failed to delete contact');
          return;
        }

        loadDashboard();
      }

      function exportCsv(filename, rows) {
        const csv = rows.map((row) => row.map((cell) => escapeCsv(cell)).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      async function loadDashboard() {
        const token = getToken();
        if (!token) {
          showLogin();
          return;
        }

        const res = await fetch('/api/admin/entries', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (!res.ok) {
          clearToken();
          showLogin();
          return;
        }

        const result = await res.json();
        if (!result.success) {
          clearToken();
          showLogin();
          return;
        }

        const bookings = result.data.bookings || [];
        const contacts = result.data.contacts || [];
        const bookingSearch = document.getElementById('bookingSearch')?.value || '';
        const bookingFilter = document.getElementById('bookingFilter')?.value || 'all';
        const contactSearch = document.getElementById('contactSearch')?.value || '';

        const visibleBookings = getFilteredBookings(bookings, bookingSearch, bookingFilter);
        const visibleContacts = getFilteredContacts(contacts, contactSearch);

        document.getElementById('totalBookings').textContent = bookings.length;
        document.getElementById('totalContacts').textContent = contacts.length;
        document.getElementById('pendingCount').textContent = bookings.filter((item) => (item.status || 'new') === 'new').length;

        document.getElementById('bookingsTable').innerHTML = visibleBookings.length ? `
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Service</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${visibleBookings.map((item) => `
                <tr>
                  <td>${item.id}</td>
                  <td>${item.name}</td>
                  <td>${item.phone}</td>
                  <td>${item.service}</td>
                  <td>${item.date}</td>
                  <td>
                    <select class="status-select" data-booking-id="${item.id}" data-current-status="${item.status || 'new'}">
                      <option value="new" ${item.status === 'new' ? 'selected' : ''}>New</option>
                      <option value="contacted" ${item.status === 'contacted' ? 'selected' : ''}>Contacted</option>
                      <option value="in-progress" ${item.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                      <option value="done" ${item.status === 'done' ? 'selected' : ''}>Done</option>
                      <option value="cancelled" ${item.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                    </select>
                    <button class="status-btn" data-booking-id="${encodeURIComponent(item.id)}">Update</button>
                  </td>
                  <td><button class="danger-btn" data-delete-booking-id="${encodeURIComponent(item.id)}">Delete</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        ` : '<p class="notice">No booking requests match this filter.</p>';

        document.querySelectorAll('.status-btn').forEach((button) => {
          button.addEventListener('click', async () => {
            const bookingId = decodeURIComponent(button.getAttribute('data-booking-id'));
            const select = document.querySelector(`.status-select[data-booking-id="${bookingId}"]`);
            const nextStatus = select ? select.value : 'new';
            await updateBookingStatus(bookingId, nextStatus);
          });
        });

        document.querySelectorAll('[data-delete-booking-id]').forEach((button) => {
          button.addEventListener('click', async () => {
            const bookingId = decodeURIComponent(button.getAttribute('data-delete-booking-id'));
            await deleteBooking(bookingId);
          });
        });

        document.getElementById('contactsTable').innerHTML = visibleContacts.length ? `
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Contact</th>
                <th>Message</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${visibleContacts.map((item) => `
                <tr>
                  <td>${item.id}</td>
                  <td>${item.name}</td>
                  <td>${item.contact}</td>
                  <td>${item.message || '—'}</td>
                  <td><button class="danger-btn" data-delete-contact-id="${encodeURIComponent(item.id)}">Delete</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        ` : '<p class="notice">No contact leads match this search.</p>';

        document.querySelectorAll('[data-delete-contact-id]').forEach((button) => {
          button.addEventListener('click', async () => {
            const contactId = decodeURIComponent(button.getAttribute('data-delete-contact-id'));
            await deleteContact(contactId);
          });
        });
      }

      function showLogin() {
        loginView.classList.remove('hidden');
        adminView.classList.add('hidden');
      }

      function showAdmin() {
        loginView.classList.add('hidden');
        adminView.classList.remove('hidden');
      }

      async function updateBookingStatus(bookingId, status) {
        const token = getToken();
        if (!token) return;

        const encodedId = encodeURIComponent(bookingId);
        const res = await fetch(`/api/bookings/${encodedId}/status`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ status })
        });

        const result = await res.json();
        if (!res.ok || !result.success) {
          alert(result.message || 'Failed to update status');
          return;
        }

        loadDashboard();
      }

      function renderDashboard() {
        if (getToken()) {
          showAdmin();
          loadDashboard();
          return;
        }

        showLogin();
      }

      document.getElementById('bookingSearch').addEventListener('input', loadDashboard);
      document.getElementById('bookingFilter').addEventListener('change', loadDashboard);
      document.getElementById('contactSearch').addEventListener('input', loadDashboard);

      document.getElementById('exportBookings').addEventListener('click', async () => {
        const token = getToken();
        if (!token) return;
        const res = await fetch('/api/admin/entries', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const result = await res.json();
        if (!res.ok || !result.success) return;

        const rows = [
          ['ID', 'Name', 'Phone', 'Service', 'Date', 'Status', 'Notes'],
          ...((result.data.bookings || []).map((item) => [
            item.id,
            item.name,
            item.phone,
            item.service,
            item.date,
            item.status || 'new',
            item.notes || ''
          ]))
        ];

        exportCsv('electrotech-bookings.csv', rows);
      });

      document.getElementById('exportContacts').addEventListener('click', async () => {
        const token = getToken();
        if (!token) return;
        const res = await fetch('/api/admin/entries', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const result = await res.json();
        if (!res.ok || !result.success) return;

        const rows = [
          ['ID', 'Name', 'Contact', 'Message'],
          ...((result.data.contacts || []).map((item) => [
            item.id,
            item.name,
            item.contact,
            item.message || ''
          ]))
        ];

        exportCsv('electrotech-contacts.csv', rows);
      });

      loginBtn.addEventListener('click', login);
      logoutBtn.addEventListener('click', () => {
        clearToken();
        renderDashboard();
      });

      renderDashboard();
    </script>
  </body>
</html>
